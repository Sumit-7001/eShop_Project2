<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>MarketHub — Premium Online Shopping | Electronics, Fashion, Furniture & More</title>
    <meta name="title" content="MarketHub — Premium Online Shopping | Electronics, Fashion, Furniture & More" />
    <meta name="description" content="Shop the best deals on smartphones, watches, furniture, kids toys, fashion and more. MarketHub offers a premium shopping experience with fast delivery and secure payments." />
    <meta name="keywords" content="MarketHub, online shopping, smartphones, electronics, furniture, fashion, watches, kids toys, ecommerce" />
    <meta name="author" content="MarketHub" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ff4d4d" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://markethub.com/" />
    <meta property="og:title" content="MarketHub — Premium Online Shopping" />
    <meta property="og:description" content="Shop the best deals on smartphones, watches, furniture, kids toys and fashion. Fast delivery & secure payments." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200&h=630&fit=crop" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://markethub.com/" />
    <meta name="twitter:title" content="MarketHub — Premium Online Shopping" />
    <meta name="twitter:description" content="Shop the best deals on smartphones, watches, furniture, kids toys and fashion." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200&h=630&fit=crop" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://markethub.com/" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MarketHub",
      "url": "https://markethub.com",
      "description": "Premium multipurpose eCommerce store for electronics, fashion, furniture and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://markethub.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Dark mode flash prevention: apply theme before React loads -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('eshop_theme');
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
